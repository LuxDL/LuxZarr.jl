name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
  schedule:
    - cron: 0 * * * *
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  packages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '@JuliaTagBot trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
